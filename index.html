<h1>Diagnostic API FFBB</h1><p class="muted">Azurea / AC Golfe Juan Vallauris — identifiant club : <code>SUD0006008</code></p>
<div class="card"><p>Cette page teste si le navigateur peut appeler l’API FFBB directement depuis votre hébergement GitHub Pages. Elle n’intègre aucun token secret.</p><button id="start">Lancer les tests</button></div><div id="results"></div>
<script>
"use strict";
const API="https://api.ffbb.com"; const CLUB_ID="SUD0006008";
const results=document.getElementById("results"), button=document.getElementById("start");
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function show(title,kind,message,details){const card=document.createElement("section");card.className="card";const cls=kind==="OK"?"ok":kind==="ERREUR"?"error":"info";card.innerHTML=`<h2>${escapeHtml(title)}</h2><div class="status ${cls}"><strong>${escapeHtml(kind)}</strong>\n${escapeHtml(message)}</div>`;if(details!==undefined){const pre=document.createElement("pre");pre.textContent=typeof details==="string"?details:JSON.stringify(details,null,2);card.appendChild(pre);}results.appendChild(card);}


async function requestTest(title, url, token) {
  try {
    const headers = {
      "Accept": "application/json"
    };

    if (token) {
      headers["Authorization"] = `Bearer ${token}`;
    }

    const response = await fetch(url, {
      method: "GET",
      mode: "cors",
      cache: "no-store",
      headers
    });

    const body = await response.json();

    show(
      title,
      response.ok ? "OK" : "ERREUR",
      `Réponse HTTP ${response.status}`,
      body
    );

    return { response, body };
  } catch (error) {
    show(title, "ERREUR", error.message);
    return null;
  }
}



async function run() {
  results.replaceChildren();
  button.disabled = true;

  try {
    const configResult = await fetch(
      "https://api.ffbb.com/items/configuration",

    show("Configuration FFBB", "OK", "Configuration récupérée.");

    const token = config.data.key_dh;

    await requestTest(
      "Collection des clubs",
      "https://api.ffbb.com/items/ffbbserver_organismes?limit=1",
      token
    );
