
name: Mise à jour des matchs FFBB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 4"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Générer le calendrier
        env:
          FFBB_TOKEN: ${{ secrets.FFBB_TOKEN }}
        run: node scripts/generate-matchs.mjs

      - name: Publier le fichier JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matchs.json
          git diff --cached --quiet || (
            git commit -m "Mise à jour du calendrier des matchs" &&
            git push
          )
